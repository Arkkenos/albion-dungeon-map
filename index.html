<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Dungeon Map</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Écran de connexion par mot de passe -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1>ALBION DUNGEON MAP</h1>
            <p>Accès réservé aux membres de l'escouade</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn">CONNEXION</button>
            </form>
            <p id="login-error" class="error-msg"></p>
        </div>
    </div>

    <!-- Interface Principale -->
    <div id="app-screen" class="screen hidden">
        
        <!-- Vue 1: Liste des Maps -->
        <div id="maps-list-view" class="view">
            <header>
                <h1>ALBION DUNGEON MAP</h1>
                <button id="logout-btn" class="btn-secondary">Déconnexion</button>
            </header>
            <main class="container">
                <h2>Choisir une zone :</h2>
                <div id="maps-grid" class="maps-grid">
                    <!-- Généré dynamiquement en JS -->
                </div>
            </main>
        </div>

        <!-- Vue 2: Affichage d'une Map -->
        <div id="map-detail-view" class="view hidden">
            <header class="map-header">
                <button id="back-to-maps-btn" class="btn-back">← MAPS</button>
                <h2 id="current-map-title">PRECIPICE</h2>
                <div class="zoom-controls">
                    <button id="zoom-in" class="btn-zoom">+</button>
                    <button id="zoom-out" class="btn-zoom">-</button>
                    <button id="zoom-reset" class="btn-zoom">Reset</button>
                </div>
            </header>

            <main class="map-main">
                <div id="map-viewport" class="map-viewport">
                    <div id="map-wrapper" class="map-wrapper">
                        <img id="map-image" src="" alt="Carte de zone" draggable="false">
                        <div id="spots-layer"></div>
                    </div>
                </div>
                <footer class="map-footer">
                    <span id="spots-count">0 SPOTS DE DONJONS</span>
                </footer>
            </main>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
