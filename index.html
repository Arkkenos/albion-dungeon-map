<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Map Planner</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <h1>⚔️ Albion Online - Carte & Marqueurs</h1>
    </header>

    <main class="container">
        <!-- Contrôles et Choix de Map -->
        <section class="controls">
            <div class="form-group">
                <label for="map-select">Choisir une zone / map :</label>
                <select id="map-select">
                    <option value="martlock">Martlock Region</option>
                    <option value="bridgewatch">Bridgewatch Region</option>
                    <option value="lymhurst">Lymhurst Region</option>
                    <option value="fortsterling">Fort Sterling Region</option>
                    <option value="thetford">Thetford Region</option>
                    <option value="custom">Map Personnalisée (URL)</option>
                </select>
            </div>

            <div class="form-group" id="custom-url-group" style="display:none;">
                <label for="custom-map-url">URL de l'image de la map :</label>
                <input type="text" id="custom-map-url" placeholder="https://example.com/map.png">
            </div>

            <div class="marker-form">
                <h3>Ajouter un marqueur</h3>
                <p><small>Cliquez sur la carte pour choisir la position, ou remplissez les infos :</small></p>
                <input type="text" id="marker-title" placeholder="Titre (ex: Gisement T6, Boss, etc.)">
                <select id="marker-type">
                    <option value="resource">🌾 Ressource / Minerai</option>
                    <option value="chest">🎁 Coffre / Trésor</option>
                    <option value="boss">💀 Boss / Mob Dangeureux</option>
                    <option value="hideout">🏰 Hideout / Abri</option>
                    <option value="other">📌 Autre / Repère</option>
                </select>
                <button id="add-marker-btn" disabled>Cliquer sur la carte pour placer</button>
            </div>
        </section>

        <!-- Affichage de la carte d'Albion -->
        <section class="map-section">
            <div id="albion-map-container" class="map-container">
                <img id="albion-map-img" src="https://render.albiononline.com/v1/map/Martlock.png" alt="Carte Albion">
                <div id="markers-layer"></div>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
